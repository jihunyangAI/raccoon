<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="2026너구리: 등불을 든 너구리가 달밤의 과수원에서 빛나는 열매를 모으는 아케이드 게임">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0f33"/><stop offset=".62" stop-color="#2c1846"/><stop offset="1" stop-color="#6a3148"/>
    </linearGradient>
    <radialGradient id="moonGlow"><stop offset="0" stop-color="#fff3c8" stop-opacity=".5"/><stop offset="1" stop-color="#fff3c8" stop-opacity="0"/></radialGradient>
    <radialGradient id="lamp"><stop offset="0" stop-color="#ffc46b" stop-opacity=".62"/><stop offset="1" stop-color="#ffc46b" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6cf"/><stop offset=".55" stop-color="#ffd84a"/><stop offset="1" stop-color="#ff9d3c"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
    <g id="fruit">
      <circle r="24" fill="currentColor" opacity=".5" filter="url(#soft)"/><circle r="13" fill="currentColor"/>
      <circle cx="-4" cy="-4" r="3.5" fill="#fff" opacity=".75"/>
      <path d="M0-13c1-5 4-8 9-9-1 5-4 8-9 9z" fill="#79c466"/>
    </g>
    <g id="floor">
      <rect width="100%" height="20" y="6" fill="#6f4830"/><rect width="100%" height="9" fill="#79c466"/>
    </g>
  </defs>
  <style>
    .tw{animation:tw 2.6s ease-in-out infinite}.t2{animation-delay:-.9s}.t3{animation-delay:-1.7s}
    .bob{animation:bob 2.2s ease-in-out infinite}.b2{animation-delay:-.7s}.b3{animation-delay:-1.4s}
    .hop{animation:hop 1.1s ease-in-out infinite}
    .glow{animation:glow 1.8s ease-in-out infinite}
    @keyframes tw{50%{opacity:.15}}@keyframes bob{50%{transform:translateY(-10px)}}
    @keyframes hop{50%{transform:translateY(-7px)}}@keyframes glow{50%{opacity:.62}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    text{font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  </style>

  <rect width="1280" height="420" fill="url(#sky)"/>
  <g fill="#fff">
    <circle class="tw" cx="90" cy="60" r="2.4"/><circle class="tw t2" cx="210" cy="118" r="1.8"/><circle class="tw t3" cx="330" cy="46" r="2"/>
    <circle class="tw t2" cx="470" cy="34" r="1.6"/><circle class="tw" cx="820" cy="42" r="2"/><circle class="tw t3" cx="905" cy="104" r="1.7"/>
    <circle class="tw t2" cx="1220" cy="190" r="2.2"/><circle class="tw" cx="56" cy="190" r="1.7"/><circle class="tw t3" cx="1000" cy="52" r="1.6"/>
  </g>
  <circle cx="1100" cy="96" r="170" fill="url(#moonGlow)"/>
  <circle cx="1100" cy="96" r="58" fill="#fff0c0"/>
  <g fill="#d9c893" opacity=".7"><circle cx="1080" cy="78" r="11"/><circle cx="1122" cy="112" r="15"/><circle cx="1112" cy="66" r="6"/></g>

  <path d="M0 330C160 250 300 300 450 270S740 220 900 280 1160 250 1280 300V420H0z" fill="#22143c"/>
  <g fill="#150e2c">
    <rect x="1130" y="262" width="14" height="66"/><circle cx="1137" cy="236" r="44"/><circle cx="1104" cy="256" r="28"/><circle cx="1170" cy="256" r="28"/>
  </g>
  <g fill="#b5454f"><circle cx="1120" cy="228" r="4.5"/><circle cx="1154" cy="240" r="4.5"/><circle cx="1098" cy="258" r="4"/><circle cx="1176" cy="262" r="4"/></g>

  <svg x="0" y="366" width="1280" height="54"><use href="#floor"/></svg>
  <svg x="770" y="262" width="510" height="30"><use href="#floor"/></svg>
  <g stroke="#d2a064" stroke-width="6" stroke-linecap="round">
    <path d="M846 256V368M882 256V368"/><path stroke-width="5" d="M846 280h36M846 304h36M846 328h36M846 352h36"/>
  </g>

  <g text-anchor="middle">
    <text x="520" y="168" font-size="116" font-weight="900" fill="#ff9d3c" opacity=".55" filter="url(#soft)">2026너구리</text>
    <text x="520" y="168" font-size="116" font-weight="900" fill="none" stroke="#1a1038" stroke-width="12" stroke-linejoin="round">2026너구리</text>
    <text x="520" y="168" font-size="116" font-weight="900" fill="url(#gold)">2026너구리</text>
    <text x="520" y="222" font-size="27" font-weight="700" fill="#e4def8">달이 지기 전에, 빛나는 열매를 모두 거두세요</text>
  </g>

  <g color="#ff6b6b"><g transform="translate(980 226)"><use class="bob" href="#fruit"/></g></g>
  <g color="#ffb347"><g transform="translate(1060 226)"><use class="bob b2" href="#fruit"/></g></g>
  <g color="#c58bff"><g transform="translate(560 330)"><use class="bob b3" href="#fruit"/></g></g>
  <g color="#ffe66d"><g transform="translate(650 330)"><use class="bob" href="#fruit"/></g></g>
  <g color="#ff6b6b"><g transform="translate(740 330)"><use class="bob b2" href="#fruit"/></g></g>

  <g transform="translate(330 366)">
    <circle class="glow" cx="66" cy="-42" r="120" fill="url(#lamp)"/>
    <g class="hop">
      <g transform="translate(-44 -32) rotate(-24)">
        <ellipse cx="-16" cy="0" rx="34" ry="14" fill="#8d8a98"/>
        <path d="M-30-12q5 12 0 25M-10-14q5 14 0 28" stroke="#3b3548" stroke-width="7" fill="none"/>
      </g>
      <ellipse cx="0" cy="-30" rx="28" ry="30" fill="#a6a2b3"/>
      <ellipse cx="6" cy="-23" rx="16" ry="19" fill="#f2eee4"/>
      <path d="M-24-44q24 8 46 0l6 18q-29 14-58 0z" fill="#d9583f"/>
      <rect x="-20" y="-8" width="13" height="10" rx="5" fill="#3b3548"/><rect x="10" y="-8" width="13" height="10" rx="5" fill="#3b3548"/>
      <g transform="translate(8 -70)">
        <path d="M-27-20l3-15 14 9zM22-20l-1-15-14 9z" fill="#8d8a98"/>
        <ellipse rx="31" ry="26" fill="#c9c5d2"/>
        <path d="M-27-3q12-13 24-2 3 2 7 0 12-11 23 2-3 12-14 11-9 0-13-6-5 6-14 6-10 1-13-11z" fill="#3b3548"/>
        <circle cx="-11" cy="-3" r="4.8" fill="#fff"/><circle cx="14" cy="-3" r="4.8" fill="#fff"/>
        <circle cx="-9.500" cy="-3" r="2.6" fill="#141024"/><circle cx="15.500" cy="-3" r="2.600" fill="#141024"/>
        <ellipse cx="2" cy="12" rx="11" ry="8" fill="#f7f3ea"/><ellipse cx="2" cy="8" rx="4" ry="3" fill="#2a2333"/>
      </g>
      <path d="M26-38q20-3 30 2" stroke="#a6a2b3" stroke-width="9" stroke-linecap="round" fill="none"/>
      <path d="M58-36v9" stroke="#3b3548" stroke-width="3"/>
      <rect x="47" y="-27" width="23" height="28" rx="5" fill="#ffd27a" stroke="#7a4c2c" stroke-width="4"/>
      <path d="M50-18h17M50-8h17" stroke="#7a4c2c" stroke-width="2.500"/>
    </g>
  </g>

  <g font-weight="900" font-size="22">
    <text x="36" y="44" fill="#ff8a7a">1UP</text><text x="36" y="72" fill="#fff">000000</text>
  </g>
</svg>

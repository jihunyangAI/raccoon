<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05061a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>2026너구리</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314163f'/%3E%3Ccircle cx='16' cy='18' r='9' fill='%23ffd84a'/%3E%3Cpath d='M16 9c0-3 2-5 5-5 0 3-2 5-5 5z' fill='%2379c466'/%3E%3C/svg%3E" />
    <style>
      html, body {
        margin: 0; height: 100%; background: #05061a; overflow: hidden; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      body { display: flex; align-items: center; justify-content: center; position: fixed; inset: 0; }
      :root {
        --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
        --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
      }
      canvas { display: block; outline: none; touch-action: none; }
      #pad { display: none; position: fixed; left: 0; top: 0; pointer-events: none; }
      #rotate {
        display: none; position: fixed; inset: 0; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
        background: #0b0d2c; color: #fff3c8; text-align: center; padding: 24px;
        font: 800 22px "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      }
      #rotate i { width: 44px; height: 76px; border: 4px solid #ffd84a; border-radius: 10px; animation: turn 2s ease-in-out infinite; }
      @keyframes turn { 0%, 25% { transform: rotate(0); } 60%, 100% { transform: rotate(90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <canvas id="pad"></canvas>
    <div id="rotate"><i></i>휴대폰을 가로로 돌려 주세요</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
